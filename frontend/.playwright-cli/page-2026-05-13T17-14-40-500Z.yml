              - paragraph [ref=e463]: The discussion centers around the evolving paradigm of agentic development, highlighting the challenges and potential solutions associated with using language models (LLMs) and agents. A key issue mentioned is the nondeterministic nature of agentic development, indicating that LLMs can become outdated quickly, which impacts their effectiveness. The panel notes that while LLMs facilitate rapid development, the cost and complexity can escalate significantly with increased usage. Context management is identified as a fundamental tool for improving agentic development. Just as humans rely on communication and incentives to manage teams effectively, it is crucial to provide LLMs with the right context to guide their operations. This involves defining clear objectives and behaviors for the agents, which can be challenging but is essential for success. The analogy of stating birthday wishes illustrates the complexity of articulating specific needs, especially within a team setting where diverse opinions must be considered. Once the objectives are clearly defined, the next step is to evaluate the effectiveness of the instructions provided to the agents. Concise and well-structured documents enable better understanding and execution of tasks by LLMs, mirroring the communication dynamics in human interactions. The panel emphasizes the importance of refining instructions based on the model’s response and using appropriate formats for different types of tasks. Moreover, drawing parallels with DevOps, the argument is made that similar monitoring and evaluation strategies should be employed in agentic development. By treating the process like observing and instrumenting runtime systems, developers can better assess performance and make necessary adjustments. Ultimately, a systematic approach to context management and evaluation is essential for maximizing the utility of agents and LLMs in development processes.
