              - paragraph [ref=e138]: "In this talk, the speaker discusses how Markdown has emerged as a new programming language within the context of the Cursor application. They share their experience of transitioning from a complex code-based feature to a streamlined version implemented through Markdown, emphasizing the advantages of this shift. The presentation begins with an explanation of Git work trees and their function in Cursor. Work trees enable multiple agents to work on separate tasks without conflicting with one another, allowing for enhanced collaboration and parallel processing. The speaker describes how work trees were previously implemented with significant complexity, involving extensive code to manage separate repositories and keep tasks isolated within each work tree. The transformative step taken was replacing the intricate codebase with Markdown-based skills, leading to a substantial reduction in code—specifically, around 15,000 lines were eliminated. The new design utilizes two primary features of Cursor: agent skills and sub-agents. This innovative approach enables users to create isolated work environments simply by issuing commands in Markdown, thus simplifying the previously cumbersome process. The speaker highlights how the Markdown implementation allows users to switch to a work tree during an ongoing session seamlessly. Previously, this feature was rigid, making it easier to become confused or trapped within a single context. With the new system, users can issue a command to create or manipulate work trees on-demand, providing a flexible and user-friendly experience. Moreover, the improved command structure supports operations across multiple repositories, aiding those who work on interconnected projects, such as front-end and back-end systems. Each repo can now have its own dedicated work tree, mitigating previous limitations. Additionally, the user experience for judging outcomes from different agents has improved significantly; users can now directly compare results from multiple sub-agents, allowing for collaborative insights and enhanced decision-making. However, the speaker acknowledges some drawbacks of this new implementation. The primary concern is the model's ability to stay focused on specific tasks within designated work trees, as the previous system enforced strict boundaries that are now less rigid. Consequently, there is a risk that models may mistakenly operate outside their assigned work trees. This potential for deviation can be problematic, especially during prolonged sessions, where the models might forget their limits. User experience is another area of concern. The visibility of the new command-based system may diminish discoverability for users who were accustomed to the earlier interface, which provided a clear dropdown for task execution. As the feature is primarily for advanced users, the impact of this change is seen as manageable, albeit less intuitive for newcomers. Looking ahead, the speaker discusses plans to enhance the skills and capabilities of the Cursor system. Specific strategies include improving models through reinforcement learning (RL) and making better use of evaluation processes to uphold performance standards. They also mention a shift towards a more integrated work tree implementation within the UI of Cursor, suggesting a return to more comprehensive features while still leveraging the benefits of Markdown. The aim is to provide alternatives to Git work trees, which come with speed and storage limitations. This exploration of diverse parallelization functionalities taps into the broader need for solutions that accommodate various types of repositories beyond just Git. The talk concludes with an invitation for questions and discussions, indicating a willingness to engage further with attendees about the changes and ongoing improvements within the Cursor application. This summary encapsulates the speaker's journey from a complex code-heavy foundation to a simplified Markdown-based approach, underlining the pros and cons of such a transformative development in modern software engineering practices."
