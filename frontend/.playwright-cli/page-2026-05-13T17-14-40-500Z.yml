              - paragraph [ref=e86]: The talk opens by setting the tone for a conference focused on AI in development, particularly in the realm of coding. The speaker introduces the concept that "context is the new code," emphasizing a paradigm shift in software development practices. With the rise of AI coding agents, the approach to programming now heavily relies on providing accurate and detailed context through prompts rather than traditional coding methods. The speaker discusses the evolution of code into reusable skills and workflows, wherein large pieces of code can be transformed into manageable context-driven skills. This approach simplifies complex coding tasks, allowing AI agents to handle intricate processes based on user-defined context. The speaker draws parallels to the DevOps movement of 2009, suggesting that the future may involve a "context development life cycle" (CDLC), where the generation, testing, evaluation, and distribution of context become systematic parts of software development. Key components of the CDLC are outlined. First, the **generation** of context involves creating prompts that effectively communicate the required information to coding agents. The presentation notes the importance of reusability and the integration of documentation and up-to-date library information to ensure AI agents produce accurate output. Next is **testing**. The speaker argues that as context becomes more critical, establishing tests to evaluate how well this context guides the coding agent becomes vital. Different levels of context testing are suggested, including basic validation and more complex evaluative tests, which can assess whether the context meets predefined specifications, similar to how coding frameworks handle unit testing. The concept of **distribution** is then explored, where reusable context is stored and shared through repositories, akin to code libraries. The speaker illustrates the importance of having a framework for discovering and maintaining these contexts to prevent "dependency hell," where conflicts arise from using different versions or sources of context. The talk further emphasizes the value of **observability**. As coding agents interact with various contexts, monitoring their performance through logs and feedback loops becomes essential. This data can help improve context and adapt it based on real-world usage and problems encountered. Finally, the discussion touches on the importance of a structured approach when integrating AI agents into software development, suggesting that organizations should foster a culture where teams collaboratively improve their context and share learnings. The speaker underscores that while AI coding agents are powerful, the effectiveness of these tools hinges on the quality of the input they receive, which in this context means carefully crafted, clear, and relevant context. In essence, the speaker advocates for a more systematic, thoughtful approach in which context—not just code—becomes an integral part of the software development process in the era of AI. This involves generating high-quality context, rigorously testing it, sharing it effectively, and maintaining an observant eye on how it performs in practice. The closing notes invite the audience to engage further, either by connecting on professional networks or exploring new tools like Tessel that embody this evolving landscape of AI in coding.
