                - paragraph [ref=e423]: 4 Ways AI Agents Should Behave for Smarter Systems
              - paragraph [ref=e424]: "In this exploration of artificial intelligence (AI), the central premise is to understand the decision-making processes within AI applications, particularly focusing on how we categorize their capabilities and interactions as \"agents.\" The typical Hollywood portrayal of AI agents as all-powerful \"super agents\" is critiqued, emphasizing the need for a more practical understanding of agents as collaboration-driven entities that work together on specific tasks. The ideal framework envisions a system where multiple agents collaborate to achieve larger objectives, much like workers on a road project coordinating their efforts. To construct effective agentic systems, it is crucial to avoid certain pitfalls, such as \"super agency,\" where agents possess excessive freedom to act independently. This notion highlights the importance of limiting both the actions agents can take and the privileges they are granted. The goal is to implement minimized access and actions, which aligns with the software engineering principle of \"high cohesion.\" This means that an agent's tasks and the access it requires to perform them should be closely aligned. Collaboration among agents is emphasized as a desirable feature, steering clear from a model dependent on a single, all-powerful agent. Instead, agents should be orchestrated to work in harmony, enhancing efficiency and task execution. The complexity of categorizing agents arises from their varied capabilities and risk levels. The discussion introduces a spectrum concept, placing agents along a continuum defined by their risk and capability levels—essentially a two-dimensional model categorizing agents by their ability to act and the potential negative impact of those actions. This two-dimensional framework results in a four-quadrant model: 1. **High Capability, Low Risk:** Agents that can perform complex operations without interacting with sensitive data, like an internal style editor. 2. **Low Capability, Low Risk:** Simple agents tasked with limited actions, such as information retrieval from non-sensitive databases. 3. **Low Capability, High Risk:** Agents with limited reasoning capabilities but significant access to sensitive data, like financial extractors that can read but not modify data. 4. **High Capability, High Risk:** More complex agents capable of initiating actions in sensitive contexts, such as automated payment systems. A key takeaway here is the differentiation in how agents should function based on the assigned risks and capabilities. Agents in the high capability, high risk quadrant require more stringent controls and often benefit from a \"human-in-the-loop\" approach, where a human must approve actions before they are executed. This emphasizes the need for oversight in systems with significant risks to prevent unintended consequences. To sum up, the discussion advocates for developing a diverse set of agents tailored to specific tasks, categorized intelligently to reflect their capabilities and associated risks. Such a structured approach prevents overreliance on a singular \"super agent\" model, instead favoring collaboration and precise task allocation among specialized agents. This nuanced framework serves as a guiding principle for effectively building and managing agentic systems in AI."
