              - paragraph [ref=e268]: In this insightful talk about "agentic engineering," the speaker discusses a pivotal shift in how engineers utilize artificial intelligence (AI) in their work. While 90% of engineers are reported to use AI tools, many struggle to articulate how these tools fit into their workflow beyond superficial benefits like increased coding speed. The speaker emphasizes that the current landscape of AI in software engineering has evolved significantly—from simple autocomplete features to AI that acts as a collaborative partner in coding. This evolution has introduced a more sophisticated interaction model where engineers should see AI not merely as a tool but as an enthusiastic, highly knowledgeable junior developer that lacks contextual judgment. The speaker elaborates on the concept of "context engineering" as a critical skill for engineers engaging with AI. Context is deemed expensive because every piece of input adds not just cost but can dilute the output quality. Thus, effectively managing context is necessary to enhance AI performance. This involves clearly defining the information fed into the AI, being selective about what is included, and regularly trimming and summarizing context as needed. Also highlighted is the importance of starting fresh sessions when things go awry to avoid compounding errors stemming from bad context. Concrete strategies for improving the integration of AI in engineering processes are provided. Context management can be achieved by persisting valuable information outside the input context, curating relevant details, and employing techniques like parallel agents to avoid surpassing the optimal context size. The speaker anchors these ideas in personal anecdotes from their early career, underscoring the necessity of providing clear context to junior developers—be it human or AI. Moving to practical applications, the speaker introduces a structured approach to using AI in engineering through a "research, plan,