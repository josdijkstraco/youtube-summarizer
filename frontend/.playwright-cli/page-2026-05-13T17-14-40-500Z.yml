              - paragraph [ref=e164]: AI agents are designed to tackle complex tasks that exceed the capabilities of individual large language models (LLMs). To achieve this, they must operate as teams, similar to human collaborative efforts, with distinct roles enhancing the overall productivity of the agent. Key roles in an AI agent team include doers, planners, tool operators, learners, critics, supervisors, and presenters. Doers execute specific actions such as coding, while planners devise step-by-step strategies based on user input. For example, in mobile app development, a planner creates user requirements and app architecture before coding begins. Tool operators manage interactions with APIs and other tools, ensuring structured inputs and outputs. Learners gather relevant market information, akin to a team member conducting research on competitor applications to enhance user features. Critics provide essential feedback, checking for errors and evaluating multiple outputs, much like a person who regularly assesses a team's quality of work. Supervisors oversee progress at various levels, ensuring tasks move forward and identifying roadblocks. Finally, presenters synthesize the completed work and communicate back to the user, summarizing what has been achieved. To make each agent role effective, strategies such as prompting, selecting appropriate models, tuning models with examples, and managing context are crucial. Prompting involves giving clear instructions, as one would to a teammate, while model selection ensures that the right type of AI is matched to the designated role. Model tuning enhances performance through training with diverse examples. Lastly, providing the right context is essential to help an agent focus on necessary tasks without distractions. As AI agent teams begin with a few key roles, they should expand over time to fill gaps and refine outputs. This growth mirrors a startup evolving to enhance its product quality through specialized skill sets and increased planning capabilities, ultimately leading to robust, efficient solutions.
