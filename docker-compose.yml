services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data
      - ./cookies.txt:/app/cookies.txt:ro
      - ./downloads:/app/downloads
    env_file:
      - ./backend/.env
    environment:
      - DOWNLOAD_DIR=/app/downloads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8002
    ports:
      - "3002:80"
    depends_on:
      - backend
    restart: unless-stopped
